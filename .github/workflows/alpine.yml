name: Build and Push Alpine Image

on:
  push:
    paths:
      - "alpine/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docker.io

    runs-on: ubuntu-26.04

    steps:
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up BUILDX
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            alpine
          images: |
            arakurumi/myne
          labels: |
            org.opencontainers.image.authors=Kurumi <kqruumi@gmail.com>
            org.opencontainers.image.description=Docker Images for My Project
            org.opencontainers.image.licenses=Unlicense
            org.opencontainers.image.title=Docker-Myne
            org.opencontainers.image.version={{date 'YYYYMMDD'}}

      - name: Build and Push to Docker.io
        uses: docker/build-push-action@v7
        with:
          push: true
          context: "{{defaultContext}}:alpine"
          no-cache: true
          provenance: false
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
