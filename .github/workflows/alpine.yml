name: Build and Push Alpine Image

on:
  push:
    paths:
      - "alpine/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: arakurumi/myne
  CONTEXT_SUFFIX: alpine

jobs:
  meta:
    name: Prepare Metadata

    runs-on: ubuntu-26.04

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Set Up Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            alpine
          images: |
            arakurumi/myne
          labels: |
            org.opencontainers.image.authors=Kurumi <kqruumi@gmail.com>
            org.opencontainers.image.description=Docker Images for My Project
            org.opencontainers.image.licenses=Unlicense
            org.opencontainers.image.title=Docker-Myne
            org.opencontainers.image.version={{date 'YYYYMMDD'}}

  build:
    name: Build (${{ matrix.platform }})

    needs: meta

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Set Up BUILDX
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Cache Bust
        id: cache-bust
        run: echo "daily=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:${{ env.CONTEXT_SUFFIX }}"
          platforms: ${{ matrix.platform }}
          build-args: |
            CACHE_BUST=${{ steps.cache-bust.outputs.daily }}
          cache-from: type=gha,scope=${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          provenance: false
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Multi-Arch Manifest

    needs:
      - meta
      - build

    runs-on: ubuntu-26.04

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ env.CONTEXT_SUFFIX }}-*
          merge-multiple: true

      - name: Set Up BUILDX
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create Manifest List
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="$tag_args --tag $tag"
          done <<< "$TAGS"
          docker buildx imagetools create $tag_args \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

  verify:
    name: Verify Packages

    needs: merge

    runs-on: ubuntu-26.04

    steps:
      - name: Pull Image
        run: docker pull ${{ env.IMAGE }}:${{ env.CONTEXT_SUFFIX }}

      - name: Verify Installed Packages
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ env.CONTEXT_SUFFIX }} /bin/sh -c '
            fail=0
            count=0
            green="\033[1;32m"
            red="\033[1;31m"
            bold="\033[1m"
            dim="\033[2m"
            reset="\033[0m"

            getver() {
              case "$1" in
                7z) 7z i 2>&1 ;;
                aria2-next|aria2c) aria2-next --version 2>&1 ;;
                bun) bun --version 2>&1 ;;
                ccextractor) ccextractor --version 2>&1 ;;
                code-server) code-server --version 2>&1 ;;
                curl) curl --version 2>&1 ;;
                dovi_tool) dovi_tool --version 2>&1 ;;
                fastfetch) fastfetch --version 2>&1 ;;
                ffmpeg) ffmpeg -version 2>&1 ;;
                file) file --version 2>&1 ;;
                git) git --version 2>&1 ;;
                gost) gost -V 2>&1 ;;
                hdr10plus_tool) hdr10plus_tool --version 2>&1 ;;
                m3u8) m3u8 --version 2>&1 ;;
                mediainfo) mediainfo --Version 2>&1 ;;
                mkvextract|mkvmerge|mkvinfo|mkvpropedit) mkvmerge --version 2>&1 ;;
                MP4Box) MP4Box -version 2>&1 ;;
                mp4dump|mp4info|mp4mux) mp4info -version 2>&1 ;;
                pip) pip --version 2>&1 ;;
                python3) python3 --version 2>&1 ;;
                qbittorrent-nox) qbittorrent-nox --version 2>&1 ;;
                rclone) rclone version 2>&1 ;;
                shaka-packager) shaka-packager --version 2>&1 ;;
                sox) sox --version 2>&1 ;;
                usque) usque version 2>&1 ;;
                wget) wget --version 2>&1 ;;
                *) return 1 ;;
              esac | grep -oE "([0-9]+\.)+[0-9]+" | sed "s/^v//" | head -n 1
            }

            # ccextractor is only built for x86_64/amd64; skip it on other archs
            case "$(uname -m)" in
              x86_64 | amd64) skip_ccextractor=0 ;;
              *)              skip_ccextractor=1 ;;
            esac

            printf "\n  ${bold}Verifying installed packages${reset}\n"
            printf "  ${dim}--------------------------------------------------${reset}\n"

            for tool in \
              7z aria2-next aria2c bun ccextractor code-server curl dovi_tool fastfetch ffmpeg \
              file git gost hdr10plus_tool m3u8 mediainfo mkvextract mkvinfo mkvmerge \
              mkvpropedit MP4Box mp4dump mp4info mp4mux pip python3 qbittorrent-nox \
              rclone shaka-packager sox usque wget; do
              if [ "$tool" = "ccextractor" ] && [ "$skip_ccextractor" -eq 1 ]; then
                printf "  ${dim}  %-18s %s${reset}\n" "$tool" "skipped (unsupported arch)"
                continue
              fi
              count=$((count + 1))
              if command -v "$tool" >/dev/null 2>&1; then
                ver=$(getver "$tool")
                [ -z "$ver" ] && ver="version unknown"
                printf "  ${green}✔${reset}  %-18s %s\n" "$tool" "$ver"
              else
                fail=$((fail + 1))
                printf "  ${red}✖${reset}  %-18s %s\n" "$tool" "not found"
              fi
            done

            printf "  ${dim}--------------------------------------------------${reset}\n"
            if [ "$fail" -gt 0 ]; then
              printf "  ${red}✖${reset}  %d of %d package(s) missing\n" "$fail" "$count"
              exit 1
            fi
            printf "  ${green}✔${reset}  All %d packages installed correctly\n" "$count"
          '